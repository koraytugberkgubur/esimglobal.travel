name: Check provider prices

on:
  workflow_dispatch:
  push:
    branches: [codex/provider-price-checking]
    paths:
      - scripts/collect-provider-pages.mjs
      - scripts/provider-price-parsers.mjs
      - scripts/refresh-provider-prices.mjs
      - .github/workflows/check-provider-prices.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:prices
      - name: Match official product prices
        run: npm run prices:refresh -- --fetch
      - uses: actions/upload-artifact@v4
        with:
          name: provider-price-check
          path: |
            data/provider-prices.json
            data/price-check-report.json
          retention-days: 7
